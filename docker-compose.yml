# ─────────────────────────────────────────────────────────────────────────────
# SmartShop Elite — Docker Compose
# Services: app (Streamlit), redis (background processing)
# ─────────────────────────────────────────────────────────────────────────────

version: "3.9"

services:
  # ── Streamlit Application ──────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartshop-elite
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      # Persist the vector DB and dataset between restarts
      - ./dataset:/app/dataset
      - ./vector_db:/app/vector_db
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Redis (background processing / session caching) ───────────────────────
  redis:
    image: redis:7-alpine
    container_name: smartshop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
    driver: local
